<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>Literature Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --fg: #202124;
      --muted: #68707b;
      --border: #d8dbe0;
      --soft: #eef3fb;
      --accent: #2f6fca;
      --green: #2e7d45;
      --green-soft: #eaf6ed;
      --orange: #a86200;
      --orange-soft: #fff4df;
      --danger: #b33a2b;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      min-width: 760px;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    body { padding: 18px; }
    button, input { color: inherit; font: inherit; }
    button {
      min-height: 32px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); background: var(--soft); }
    button:disabled { cursor: default; opacity: .55; }
    .page-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .back-button {
      flex: none;
      min-width: 38px;
      padding-inline: 9px;
      font-size: 17px;
    }
    .title-wrap { min-width: 0; flex: 1; }
    .app-title { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .paper-title {
      overflow: hidden;
      margin-top: 2px;
      font-size: 18px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }
    .tab.active {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--accent);
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .filter-field {
      flex: 1 1 145px;
      min-width: 135px;
    }
    .filter-field.search-field {
      flex: 2 1 250px;
      min-width: 220px;
    }
    .filter-field.year-field {
      flex-basis: 180px;
      min-width: 170px;
    }
    .filter-label {
      display: block;
      margin: 0 0 4px 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 34px;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
    }
    input:focus {
      border-color: var(--accent);
      outline: 2px solid color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .year-inputs {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .year-inputs input {
      min-width: 0;
      appearance: textfield;
    }
    .year-inputs input::-webkit-inner-spin-button { appearance: none; }
    .year-separator { flex: none; color: var(--muted); }
    /* Native HTML select popups are unreliable in Zotero chrome XHTML dialogs.
       The explorer uses a document-rendered listbox instead, matching panel.js. */
    .dropdown { position: relative; }
    .dropdown-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 34px;
      text-align: left;
    }
    .dropdown-label {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dropdown-caret { flex: none; color: var(--muted); font-size: 10px; }
    .dropdown-toggle[aria-expanded="true"] {
      border-color: var(--accent);
      background: var(--soft);
    }
    .dropdown-menu {
      position: fixed;
      z-index: 900;
      display: flex;
      flex-direction: column;
      max-height: min(320px, calc(100vh - 12px));
      overflow-y: auto;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--card);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .28);
    }
    .dropdown-option {
      min-height: 30px;
      border: none;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      white-space: nowrap;
    }
    .dropdown-option:hover, .dropdown-option:focus { background: var(--soft); }
    .dropdown-option.chosen {
      background: var(--soft);
      color: var(--accent);
      font-weight: 700;
    }
    .toolbar > #refresh { flex: 0 0 auto; }
    .collection-toolbar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 10px;
    }
    .collection-toolbar .search-field { max-width: 520px; }
    .view[hidden] { display: none !important; }
    .status {
      min-height: 22px;
      margin: 0 2px 7px;
      color: var(--muted);
      font-size: 12px;
    }
    .status.error { color: var(--danger); }
    .table-wrap {
      overflow: auto;
      min-height: 420px;
      max-height: calc(100vh - 230px);
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
    }
    #collection-view .table-wrap { max-height: calc(100vh - 165px); }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
      text-align: left;
      vertical-align: middle;
    }
    th {
      position: sticky;
      z-index: 2;
      top: 0;
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    th.title-col { width: 49%; }
    th.year-col { width: 8%; }
    th.citations-col { width: 10%; }
    th.influence-col { width: 11%; }
    th.source-col { width: 11%; }
    th.library-col { width: 11%; text-align: center; }
    .collection-table th.title-col { width: 34%; }
    .collection-table th.creator-col { width: 20%; }
    .collection-table th.year-col { width: 7%; }
    .collection-table th.date-added-col { width: 12%; }
    .collection-table th.state-col { width: 9%; text-align: center; }
    td.numeric { font-variant-numeric: tabular-nums; }
    td.library { text-align: center; }
    td.state { text-align: center; }
    tr.in-library { background: var(--green-soft); }
    tr.not-in-library { background: var(--orange-soft); }
    .paper-link {
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-weight: 650;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .paper-link:hover { background: transparent; text-decoration: underline; }
    .paper-meta {
      overflow: hidden;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }
    .library-action {
      width: 31px;
      min-height: 29px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      line-height: 27px;
    }
    .library-action.present { border-color: var(--green); color: var(--green); }
    .library-action.add { border-color: var(--orange); color: var(--orange); }
    .state-action {
      min-width: 34px;
      min-height: 29px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .state-action.ready {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }
    .state-action.pending {
      border-color: var(--orange);
      background: var(--orange-soft);
      color: var(--orange);
    }
    .state-action.unavailable {
      border-color: var(--border);
      color: var(--muted);
    }
    .collection-paper-link {
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: inherit;
      font-weight: 650;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .collection-paper-link:hover {
      background: transparent;
      color: var(--accent);
      text-decoration: underline;
    }
    .footer {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    .empty-cell {
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --card: #292b2f;
        --fg: #e7e9ec;
        --muted: #aeb4bc;
        --border: #484c53;
        --soft: #303b4c;
        --accent: #78aaf2;
        --green: #78c58a;
        --green-soft: #24372a;
        --orange: #e4aa52;
        --orange-soft: #3b3020;
        --danger: #f08374;
      }
    }
    @media (max-width: 900px) {
      .filter-field { flex-basis: calc(50% - 4px); }
      .filter-field.search-field { flex-basis: 100%; }
      th.source-col, td.source { display: none; }
      th.title-col { width: 52%; }
      .collection-table th.creator-col,
      .collection-table td.creator,
      .collection-table th.date-added-col,
      .collection-table td.date-added { display: none; }
      .collection-table th.title-col { width: 55%; }
    }
  </style>
  <script src="literature-explorer.js"></script>
</head>
<body>
  <header class="page-head">
    <button class="back-button" id="back-to-collection" hidden="hidden">←</button>
    <div class="title-wrap">
      <div class="app-title" id="app-title">Literature Explorer</div>
      <div class="paper-title" id="paper-title"></div>
    </div>
  </header>

  <section class="view" id="collection-view">
    <div class="collection-toolbar">
      <div class="filter-field search-field">
        <label class="filter-label" id="label-collection-search"
          for="collection-search"></label>
        <input id="collection-search" type="search"/>
      </div>
      <button id="collection-refresh"></button>
    </div>
    <div class="status" id="collection-status" role="status"></div>
    <div class="table-wrap">
      <table class="collection-table">
        <thead>
          <tr>
            <th class="title-col" id="collection-head-title"></th>
            <th class="creator-col" id="collection-head-creator"></th>
            <th class="year-col" id="collection-head-year"></th>
            <th class="date-added-col" id="collection-head-date-added"></th>
            <th class="state-col" id="collection-head-markdown"></th>
            <th class="state-col" id="collection-head-references"></th>
            <th class="state-col" id="collection-head-citations"></th>
          </tr>
        </thead>
        <tbody id="collection-rows"></tbody>
      </table>
    </div>
  </section>

  <section class="view" id="detail-view" hidden="hidden">
    <nav class="tabs" aria-label="Relation type">
      <button class="tab" id="tab-references" data-kind="references"></button>
      <button class="tab" id="tab-citations" data-kind="citations"></button>
    </nav>

    <div class="toolbar">
      <div class="filter-field search-field">
        <label class="filter-label" id="label-search" for="search"></label>
        <input id="search" type="search"/>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-library"></div>
        <div id="filter-library"></div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-influence"></div>
        <div id="filter-influence"></div>
      </div>
      <div class="filter-field year-field">
        <div class="filter-label" id="label-year"></div>
        <div class="year-inputs">
          <input id="year-from" type="number" inputmode="numeric"/>
          <span class="year-separator">–</span>
          <input id="year-to" type="number" inputmode="numeric"/>
        </div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-publication-type"></div>
        <div id="filter-publication-type"></div>
      </div>
      <div class="filter-field" id="publication-level-field" hidden="hidden">
        <div class="filter-label" id="label-publication-level"></div>
        <div id="filter-publication-level"></div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-order"></div>
        <div id="sort"></div>
      </div>
      <button id="refresh"></button>
    </div>

    <div class="status" id="status" role="status"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="title-col" id="head-title"></th>
            <th class="year-col" id="head-year"></th>
            <th class="citations-col" id="head-citations"></th>
            <th class="influence-col" id="head-influence"></th>
            <th class="source-col" id="head-source"></th>
            <th class="library-col" id="head-library"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="footer">
      <button id="load-more" hidden="hidden"></button>
    </div>
  </section>
</body>
</html>
