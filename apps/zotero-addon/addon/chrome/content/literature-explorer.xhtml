<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>Unizero Home</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --fg: #202124;
      --muted: #68707b;
      --border: #d8dbe0;
      --soft: #eef3fb;
      --accent: #2f6fca;
      --green: #2e7d45;
      --green-soft: #eaf6ed;
      --orange: #a86200;
      --orange-soft: #fff4df;
      --danger: #b33a2b;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 760px;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    /* Lock the window to the viewport: chrome is thin, the table fills the rest
       and scrolls on its own, so the tab strip and filters never scroll away. */
    body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 12px;
      min-height: 0;
    }
    button, input { color: inherit; font: inherit; }
    button {
      min-height: 32px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); background: var(--soft); }
    button:disabled { cursor: default; opacity: .55; }
    .page-head {
      display: flex;
      flex: none;
      align-items: baseline;
      gap: 10px;
      min-height: 0;
    }
    /* Window-level tab strip: one tab per open paper. */
    .page-tabs {
      display: flex;
      flex: none;
      overflow-x: auto;
      align-items: stretch;
      gap: 4px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: thin;
    }
    .page-tab {
      display: flex;
      align-items: center;
      flex: none;
      max-width: 230px;
      gap: 6px;
      min-height: 30px;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: transparent;
      color: var(--muted);
    }
    .page-tab:hover { border-color: var(--border); background: var(--soft); }
    .page-tab.active {
      border-color: var(--border);
      background: var(--card);
      color: var(--fg);
      font-weight: 700;
    }
    .page-tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Sized and reserved even when idle, so revealing it cannot reflow the strip
       and slide the next tab under the pointer mid-click. */
    .page-tab-close {
      flex: none;
      min-height: 0;
      width: 17px;
      height: 17px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      line-height: 1;
      visibility: hidden;
    }
    .page-tab:hover .page-tab-close,
    .page-tab.active .page-tab-close { visibility: visible; }
    .page-tab-close:hover { background: var(--border); color: var(--fg); }
    .title-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .app-title {
      flex: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .paper-title {
      overflow: hidden;
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #explorer-workspace {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    #detail-view.view {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      flex: none;
      gap: 5px;
      margin-bottom: 8px;
    }
    .tab.active {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--accent);
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      flex: none;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .filter-field {
      flex: 1 1 145px;
      min-width: 135px;
    }
    .filter-field.search-field {
      flex: 2 1 250px;
      min-width: 220px;
    }
    .filter-field.year-field {
      flex-basis: 180px;
      min-width: 170px;
    }
    .filter-label {
      display: block;
      margin: 0 0 4px 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 34px;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
    }
    input:focus {
      border-color: var(--accent);
      outline: 2px solid color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .year-inputs {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .year-inputs input {
      min-width: 0;
      appearance: textfield;
    }
    .year-inputs input::-webkit-inner-spin-button { appearance: none; }
    .year-separator { flex: none; color: var(--muted); }
    /* Native HTML select popups are unreliable in Zotero chrome XHTML dialogs.
       The explorer uses a document-rendered listbox instead, matching panel.js. */
    .dropdown { position: relative; }
    .dropdown-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 34px;
      text-align: left;
    }
    .dropdown-label {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dropdown-caret { flex: none; color: var(--muted); font-size: 10px; }
    .dropdown-toggle[aria-expanded="true"] {
      border-color: var(--accent);
      background: var(--soft);
    }
    .dropdown-menu {
      position: fixed;
      z-index: 900;
      display: flex;
      flex-direction: column;
      max-height: min(320px, calc(100vh - 12px));
      overflow-y: auto;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--card);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .28);
    }
    .dropdown-option {
      min-height: 30px;
      border: none;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      white-space: nowrap;
    }
    .dropdown-option:hover, .dropdown-option:focus { background: var(--soft); }
    .dropdown-option.chosen {
      background: var(--soft);
      color: var(--accent);
      font-weight: 700;
    }
    .toolbar > #refresh { flex: 0 0 auto; }
    .view[hidden] { display: none !important; }
    .status {
      flex: none;
      min-height: 20px;
      margin: 0 2px 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .status.error { color: var(--danger); }
    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
    }
    #detail-view .footer {
      flex: none;
      margin-top: 6px;
    }
    #detail-view .progress {
      flex: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
      text-align: left;
      vertical-align: middle;
    }
    th {
      position: sticky;
      z-index: 2;
      top: 0;
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    th.title-col { width: 49%; }
    th.year-col { width: 8%; }
    th.citations-col { width: 10%; }
    th.influence-col { width: 11%; }
    th.source-col { width: 11%; }
    th.library-col { width: 11%; text-align: center; }
    #detail-view.relation-mode th.title-col { width: 57%; }
    #detail-view.relation-mode th.year-col { width: 8%; }
    #detail-view.relation-mode th.citations-col { width: 15%; }
    #detail-view.relation-mode th.influence-col { width: 11%; }
    #detail-view.relation-mode th.library-col { width: 9%; }
    #detail-view.relation-mode th.source-col,
    #detail-view.relation-mode td.source { display: none; }
    td.numeric { font-variant-numeric: tabular-nums; }
    td.library { text-align: center; }
    tr.in-library { background: var(--green-soft); }
    tr.not-in-library { background: var(--orange-soft); }
    .paper-link {
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-weight: 650;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .paper-link:hover { background: transparent; text-decoration: underline; }
    .paper-meta {
      overflow: hidden;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }
    .library-action {
      width: 31px;
      min-height: 29px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      line-height: 27px;
    }
    .library-action.present { border-color: var(--green); color: var(--green); }
    .library-action.add { border-color: var(--orange); color: var(--orange); }
    .footer {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    .empty-cell {
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }
    /* Shown in place of the table when a paper has no saved relations: fetching
       is an explicit action, never a side effect of opening the paper. */
    .empty-cell .fetch-now { margin-top: 12px; }
    /* In-window load progress: shown while sources are being fetched. */
    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 2px 8px;
    }
    .progress-track {
      position: relative;
      flex: 1 1 auto;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft);
    }
    .progress-fill {
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      animation: progress-slide 1.1s ease-in-out infinite;
    }
    @keyframes progress-slide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    .progress-sources { display: flex; flex: none; gap: 6px; }
    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .progress-pill.ok {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }
    .progress-pill.error { border-color: var(--danger); color: var(--danger); }
    .progress-pill.restricted {
      border-color: var(--orange);
      background: var(--orange-soft);
      color: var(--orange);
    }
    .progress-pill.skipped { opacity: .5; }
    /* Floating preview card shown on row hover. */
    .row-preview {
      position: fixed;
      z-index: 1200;
      width: 400px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      overflow: hidden;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .3);
      pointer-events: none;
    }
    .row-preview-title {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }
    .row-preview-meta {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .row-preview-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 8px 0 2px;
    }
    .row-preview-tag {
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }
    .row-preview-tag.muted {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .row-preview-abstract {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 8px;
      color: var(--fg);
      font-size: 12px;
      line-height: 1.5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 8;
    }
    .row-preview-abstract.empty { color: var(--muted); font-style: italic; }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --card: #292b2f;
        --fg: #e7e9ec;
        --muted: #aeb4bc;
        --border: #484c53;
        --soft: #303b4c;
        --accent: #78aaf2;
        --green: #78c58a;
        --green-soft: #24372a;
        --orange: #e4aa52;
        --orange-soft: #3b3020;
        --danger: #f08374;
      }
    }
    @media (max-width: 900px) {
      .filter-field { flex-basis: calc(50% - 4px); }
      .filter-field.search-field { flex-basis: 100%; }
      th.source-col, td.source { display: none; }
      th.title-col { width: 52%; }
    }
  </style>
  <script src="literature-explorer.js"></script>
</head>
<body>
  <nav class="page-tabs" id="page-tabs" aria-label="Open papers"></nav>

  <header class="page-head">
    <div class="title-wrap">
      <div class="app-title" id="app-title">Unizero Home</div>
      <div class="paper-title" id="paper-title"></div>
    </div>
  </header>

  <main id="explorer-workspace">
  <section class="view" id="detail-view">
    <nav class="tabs" aria-label="Relation type">
      <button class="tab" id="tab-references" data-kind="references"></button>
      <button class="tab" id="tab-relation" data-kind="relation"></button>
      <button class="tab" id="tab-citations" data-kind="citations"></button>
    </nav>

    <div class="toolbar">
      <div class="filter-field search-field">
        <label class="filter-label" id="label-search" for="search"></label>
        <input id="search" type="search"/>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-source"></div>
        <div id="filter-source"></div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-library"></div>
        <div id="filter-library"></div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-influence"></div>
        <div id="filter-influence"></div>
      </div>
      <div class="filter-field year-field">
        <div class="filter-label" id="label-year"></div>
        <div class="year-inputs">
          <input id="year-from" type="number" inputmode="numeric"/>
          <span class="year-separator">–</span>
          <input id="year-to" type="number" inputmode="numeric"/>
        </div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-publication-type"></div>
        <div id="filter-publication-type"></div>
      </div>
      <div class="filter-field" id="publication-level-field" hidden="hidden">
        <div class="filter-label" id="label-publication-level"></div>
        <div id="filter-publication-level"></div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-order"></div>
        <div id="sort"></div>
      </div>
      <button id="refresh"></button>
    </div>

    <div class="status" id="status" role="status"></div>
    <div class="progress" id="progress" hidden="hidden">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="progress-sources" id="progress-sources"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="title-col" id="head-title"></th>
            <th class="year-col" id="head-year"></th>
            <th class="citations-col" id="head-citations"></th>
            <th class="influence-col" id="head-influence"></th>
            <th class="source-col" id="head-source"></th>
            <th class="library-col" id="head-library"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="footer">
      <button id="load-more" hidden="hidden"></button>
    </div>
  </section>
  </main>

</body>
</html>
