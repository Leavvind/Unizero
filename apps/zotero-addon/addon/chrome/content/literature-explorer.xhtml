<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>Unizero Home</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --fg: #202124;
      --muted: #68707b;
      --border: #d8dbe0;
      --soft: #eef3fb;
      --accent: #2f6fca;
      --green: #2e7d45;
      --green-soft: #eaf6ed;
      --orange: #a86200;
      --orange-soft: #fff4df;
      --danger: #b33a2b;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 760px;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    /* Lock the window to the viewport: chrome is thin, workspace fills the rest.
       Page-level scrolling is forbidden so Board and Detail stay equal height. */
    body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 12px;
      min-height: 0;
    }
    button, input { color: inherit; font: inherit; }
    button {
      min-height: 32px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); background: var(--soft); }
    button:disabled { cursor: default; opacity: .55; }
    .page-head {
      display: flex;
      flex: none;
      align-items: baseline;
      gap: 10px;
      min-height: 0;
    }
    /* Window-level tab strip: one tab per open paper, plus the Collection. */
    .page-tabs {
      display: flex;
      flex: none;
      overflow-x: auto;
      align-items: stretch;
      gap: 4px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: thin;
    }
    .page-tab {
      display: flex;
      align-items: center;
      flex: none;
      max-width: 230px;
      gap: 6px;
      min-height: 30px;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: transparent;
      color: var(--muted);
    }
    .page-tab:hover { border-color: var(--border); background: var(--soft); }
    .page-tab.active {
      border-color: var(--border);
      background: var(--card);
      color: var(--fg);
      font-weight: 700;
    }
    .page-tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Sized and reserved even when idle, so revealing it cannot reflow the strip
       and slide the next tab under the pointer mid-click. */
    .page-tab-close {
      flex: none;
      min-height: 0;
      width: 17px;
      height: 17px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      line-height: 1;
      visibility: hidden;
    }
    .page-tab:hover .page-tab-close,
    .page-tab.active .page-tab-close { visibility: visible; }
    .page-tab-close:hover { background: var(--border); color: var(--fg); }
    .title-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .app-title {
      flex: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .paper-title {
      overflow: hidden;
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #explorer-workspace {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    #collection-view.view,
    #detail-view.view {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      flex: none;
      gap: 5px;
      margin-bottom: 8px;
    }
    .tab.active {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--accent);
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      flex: none;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .filter-field {
      flex: 1 1 145px;
      min-width: 135px;
    }
    .filter-field.search-field {
      flex: 2 1 250px;
      min-width: 220px;
    }
    .filter-field.year-field {
      flex-basis: 180px;
      min-width: 170px;
    }
    .filter-label {
      display: block;
      margin: 0 0 4px 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 34px;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
    }
    input:focus {
      border-color: var(--accent);
      outline: 2px solid color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .year-inputs {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .year-inputs input {
      min-width: 0;
      appearance: textfield;
    }
    .year-inputs input::-webkit-inner-spin-button { appearance: none; }
    .year-separator { flex: none; color: var(--muted); }
    /* Native HTML select popups are unreliable in Zotero chrome XHTML dialogs.
       The explorer uses a document-rendered listbox instead, matching panel.js. */
    .dropdown { position: relative; }
    .dropdown-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 34px;
      text-align: left;
    }
    .dropdown-label {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dropdown-caret { flex: none; color: var(--muted); font-size: 10px; }
    .dropdown-toggle[aria-expanded="true"] {
      border-color: var(--accent);
      background: var(--soft);
    }
    .dropdown-menu {
      position: fixed;
      z-index: 900;
      display: flex;
      flex-direction: column;
      max-height: min(320px, calc(100vh - 12px));
      overflow-y: auto;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--card);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .28);
    }
    .dropdown-option {
      min-height: 30px;
      border: none;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      white-space: nowrap;
    }
    .dropdown-option:hover, .dropdown-option:focus { background: var(--soft); }
    .dropdown-option.chosen {
      background: var(--soft);
      color: var(--accent);
      font-weight: 700;
    }
    .toolbar > #refresh { flex: 0 0 auto; }
    .collection-toolbar {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 8px 8px 0;
    }
    .collection-toolbar .search-field {
      flex: 1 1 auto;
      min-width: 0;
      max-width: none;
    }
    .collection-toolbar > button { flex: none; }
    .project-library-pane > .status {
      margin: 4px 10px 0;
    }
    /* ----------------------------------------------------------- Project Board */
    .project-layout {
      display: grid;
      flex: 1 1 auto;
      grid-template-columns: minmax(210px, 260px) minmax(0, 1fr);
      min-height: 0;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
    }
    .project-library-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--card) 94%, var(--soft));
    }
    .project-pane-title {
      flex: none;
      padding: 8px 11px 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .project-library-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 0 7px 10px;
    }
    .project-library-item {
      display: block;
      width: 100%;
      min-height: 0;
      margin: 2px 0;
      padding: 8px 9px;
      border-color: transparent;
      background: transparent;
      text-align: left;
      cursor: grab;
    }
    .project-library-item:active { cursor: grabbing; }
    .project-library-item-title {
      display: block;
      overflow: hidden;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .project-library-item-meta {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .project-board-pane { min-width: 0; min-height: 0; position: relative; }
    .library-pane-toggle {
      position: absolute;
      z-index: 12;
      top: 10px;
      left: 12px;
      min-height: 28px;
      min-width: 32px;
      padding: 3px 8px;
      font-size: 12px;
    }
    /* Always-visible Detail dock toggle on the Board's right edge. */
    .detail-dock-toggle {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 12px;
      min-height: 28px;
      min-width: 32px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .board-toolbar {
      position: absolute;
      z-index: 10;
      top: 10px;
      right: 52px;
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .12);
    }
    .board-toolbar button {
      min-height: 28px;
      padding: 3px 9px;
      font-size: 11px;
    }
    #board-zoom-fit { min-width: 52px; font-variant-numeric: tabular-nums; }
    .board-toolbar button.active {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--accent);
    }
    .project-board-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: contain;
      background: var(--bg);
      cursor: grab;
      touch-action: none;
    }
    .project-board-viewport.panning { cursor: grabbing; }
    .project-board-surface {
      position: absolute;
      top: 0;
      left: 0;
      width: 3200px;
      height: 2200px;
      overflow: visible;
      transform-origin: 0 0;
      will-change: transform;
      background-color: var(--bg);
      background-image:
        linear-gradient(color-mix(in srgb, var(--border) 42%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--border) 42%, transparent) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .board-edge-layer {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .board-manual-edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16;
      pointer-events: stroke;
      cursor: pointer;
    }
    .board-manual-edge {
      fill: none;
      stroke: color-mix(in srgb, var(--accent) 72%, var(--muted));
      stroke-linecap: round;
      stroke-width: 2.5;
      pointer-events: none;
    }
    .board-manual-edge.selected {
      stroke: var(--orange);
      stroke-width: 4;
    }
    .board-relation-hint-edge {
      fill: none;
      stroke: color-mix(in srgb, var(--green) 72%, var(--muted));
      stroke-dasharray: 8 6;
      stroke-linecap: round;
      stroke-width: 2.25;
      pointer-events: none;
    }
    .board-relation-hint-edge.coupled {
      stroke: color-mix(in srgb, var(--orange) 70%, var(--muted));
      stroke-dasharray: 3 6;
    }
    .board-connection-preview {
      fill: none;
      stroke: var(--accent);
      stroke-dasharray: 7 5;
      stroke-linecap: round;
      stroke-width: 2.5;
      pointer-events: none;
    }
    .project-board-empty {
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      max-width: 360px;
      color: var(--muted);
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .project-board-empty strong { display: block; color: var(--fg); font-size: 14px; }
    .project-board-empty span { display: block; margin-top: 5px; font-size: 11px; }
    .board-paper-node {
      position: absolute;
      z-index: 1;
      overflow: visible;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 9px;
      background: var(--card);
      box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
      cursor: grab;
      user-select: none;
    }
    .board-paper-node:hover {
      border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
      border-left-color: var(--accent);
      box-shadow: 0 5px 16px rgba(0, 0, 0, .16);
    }
    .board-paper-node.selected {
      z-index: 2;
      outline: 2px solid color-mix(in srgb, var(--accent) 65%, transparent);
      outline-offset: 1px;
    }
    .board-paper-node.connection-target {
      outline: 3px solid color-mix(in srgb, var(--green) 72%, transparent);
      outline-offset: 3px;
    }
    .board-paper-node.relation-focus {
      z-index: 3;
      outline: 3px solid color-mix(in srgb, var(--accent) 72%, transparent);
      outline-offset: 3px;
    }
    .board-paper-node.relation-related {
      z-index: 2;
      outline: 3px solid color-mix(in srgb, var(--green) 72%, transparent);
      outline-offset: 3px;
    }
    .board-paper-node.relation-dim { opacity: .38; }
    .board-paper-node.dragging { cursor: grabbing; opacity: .92; }
    .board-paper-node.resizing { cursor: nwse-resize; }
    .board-text-node {
      padding: 0;
      border-left-width: 1px;
    }
    .board-text-node-header {
      overflow: hidden;
      padding: 7px 11px;
      border-bottom: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      background: color-mix(in srgb, var(--soft) 66%, var(--card));
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: grab;
    }
    .board-text-node.dragging .board-text-node-header { cursor: grabbing; }
    .board-text-node-body {
      height: calc(100% - 33px);
      overflow: auto;
      padding: 9px;
      border-radius: 0 0 8px 8px;
    }
    .board-text-node-body.drop-target {
      background: color-mix(in srgb, var(--green-soft) 72%, transparent);
      outline: 2px dashed var(--green);
      outline-offset: -5px;
    }
    .board-text-editor {
      display: block;
      width: 100%;
      min-height: 88px;
      resize: vertical;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--fg);
      font: inherit;
      line-height: 1.5;
    }
    .board-text-editor:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .board-embedded-paper {
      position: relative;
      margin-top: 8px;
      padding: 9px 30px 9px 10px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 7px;
      background: var(--card);
      cursor: grab;
    }
    .board-embedded-paper-title {
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .board-embedded-paper-meta {
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .board-block-remove {
      position: absolute;
      top: 5px;
      right: 5px;
      min-width: 0;
      min-height: 0;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      line-height: 1;
    }
    .board-block-remove:hover { color: var(--danger); }
    .board-embed-hint {
      margin-top: 8px;
      padding: 7px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
      pointer-events: none;
    }
    .board-node-port {
      position: absolute;
      z-index: 3;
      display: none;
      min-width: 0;
      min-height: 0;
      width: 13px;
      height: 13px;
      padding: 0;
      border: 2px solid var(--card);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 72%, var(--border));
      cursor: crosshair;
    }
    .board-node-port:hover {
      border-color: var(--card);
      background: var(--accent);
    }
    .board-paper-node:hover .board-node-port,
    .board-paper-node.selected .board-node-port { display: block; }
    .board-node-port[data-side="top"] {
      top: -7px;
      left: calc(50% - 6px);
    }
    .board-node-port[data-side="right"] {
      top: calc(50% - 6px);
      right: -7px;
    }
    .board-node-port[data-side="bottom"] {
      bottom: -7px;
      left: calc(50% - 6px);
    }
    .board-node-port[data-side="left"] {
      top: calc(50% - 6px);
      left: -7px;
    }
    .board-node-resize {
      position: absolute;
      z-index: 4;
      right: -5px;
      bottom: -5px;
      min-width: 0;
      min-height: 0;
      width: 17px;
      height: 17px;
      padding: 0;
      opacity: 0;
      border: 1px solid color-mix(in srgb, var(--accent) 72%, var(--border));
      border-radius: 5px;
      background:
        linear-gradient(
          135deg,
          transparent 0 48%,
          var(--accent) 49% 57%,
          transparent 58% 68%,
          var(--accent) 69% 77%,
          transparent 78%
        ),
        var(--card);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .16);
      cursor: nwse-resize;
      transition: opacity .12s ease;
    }
    .board-paper-node:hover .board-node-resize,
    .board-paper-node.selected .board-node-resize,
    .board-paper-node.resizing .board-node-resize { opacity: 1; }
    .board-node-title {
      display: -webkit-box;
      overflow: hidden;
      font-weight: 700;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }
    .board-node-meta {
      overflow: hidden;
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #collection-view.library-collapsed .project-layout {
      grid-template-columns: 0 minmax(0, 1fr);
    }
    #collection-view.library-collapsed .project-library-pane {
      border: none;
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
    }
    .view[hidden] { display: none !important; }
    .status {
      flex: none;
      min-height: 20px;
      margin: 0 2px 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .status.error { color: var(--danger); }
    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
    }
    #detail-view .footer {
      flex: none;
      margin-top: 6px;
    }
    #detail-view .progress {
      flex: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
      text-align: left;
      vertical-align: middle;
    }
    th {
      position: sticky;
      z-index: 2;
      top: 0;
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    th.title-col { width: 49%; }
    th.year-col { width: 8%; }
    th.citations-col { width: 10%; }
    th.influence-col { width: 11%; }
    th.source-col { width: 11%; }
    th.library-col { width: 11%; text-align: center; }
    #detail-view.relation-mode th.title-col { width: 57%; }
    #detail-view.relation-mode th.year-col { width: 8%; }
    #detail-view.relation-mode th.citations-col { width: 15%; }
    #detail-view.relation-mode th.influence-col { width: 11%; }
    #detail-view.relation-mode th.library-col { width: 9%; }
    #detail-view.relation-mode th.source-col,
    #detail-view.relation-mode td.source { display: none; }
    td.numeric { font-variant-numeric: tabular-nums; }
    td.library { text-align: center; }
    tr.in-library { background: var(--green-soft); }
    tr.not-in-library { background: var(--orange-soft); }
    tr.board-draggable-paper { cursor: grab; }
    tr.board-draggable-paper:active { cursor: grabbing; }
    .paper-link {
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-weight: 650;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .paper-link:hover { background: transparent; text-decoration: underline; }
    .paper-meta {
      overflow: hidden;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }
    .library-action {
      width: 31px;
      min-height: 29px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      line-height: 27px;
    }
    .library-action.present { border-color: var(--green); color: var(--green); }
    .library-action.add { border-color: var(--orange); color: var(--orange); }
    .footer {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    .empty-cell {
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }
    /* Shown in place of the table when a paper has no saved relations: fetching
       is an explicit action, never a side effect of opening the paper. */
    .empty-cell .fetch-now { margin-top: 12px; }
    /* In-window load progress: shown while sources are being fetched. */
    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 2px 8px;
    }
    .progress-track {
      position: relative;
      flex: 1 1 auto;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft);
    }
    .progress-fill {
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      animation: progress-slide 1.1s ease-in-out infinite;
    }
    @keyframes progress-slide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    .progress-sources { display: flex; flex: none; gap: 6px; }
    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .progress-pill.ok {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }
    .progress-pill.error { border-color: var(--danger); color: var(--danger); }
    .progress-pill.restricted {
      border-color: var(--orange);
      background: var(--orange-soft);
      color: var(--orange);
    }
    .progress-pill.skipped { opacity: .5; }
    /* ---------------------------------------------------------------- Graph */
    .graph-wrap {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
      min-height: 0;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
    }
    .graph-canvas { width: 100%; height: 100%; }
    .graph-overlay {
      position: absolute;
      z-index: 3;
      top: 9px;
      left: 11px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--card) 86%, transparent);
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .graph-legend {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    /* A swallowed render-loop failure: visible enough to report, quiet enough to ignore. */
    .graph-error {
      color: var(--danger);
      max-width: 40ch;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .graph-swatch {
      display: inline-block;
      width: 15px;
      height: 0;
      border-top: 2px solid var(--muted);
    }
    .graph-swatch.coupled { border-top-color: var(--accent); }
    .graph-empty {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: min(420px, 82%);
      color: var(--muted);
      text-align: center;
      transform: translate(-50%, -50%);
    }
    .detail-graph-filters {
      position: absolute;
      z-index: 4;
      left: 11px;
      bottom: 10px;
      display: flex;
      align-items: end;
      gap: 9px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--card) 90%, transparent);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .12);
    }
    .detail-graph-filters .filter-field { width: 150px; }
    .detail-graph-filters .shared-field { width: 92px; }
    .detail-graph-filters input { width: 100%; }
    /* ------------------------------------------------------- Graph settings */
    .graph-gear {
      position: absolute;
      z-index: 4;
      top: 9px;
      right: 11px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--card) 86%, transparent);
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .graph-gear:hover { color: var(--fg); }
    .graph-gear.open { border-color: var(--accent); color: var(--accent); }
    .graph-panel {
      position: absolute;
      z-index: 5;
      top: 41px;
      right: 11px;
      width: 236px;
      max-height: calc(100% - 56px);
      overflow-y: auto;
      padding: 10px 12px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
      font-size: 11px;
    }
    .graph-panel h4 {
      margin: 10px 0 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .graph-panel h4:first-child { margin-top: 0; }
    .graph-setting {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 2px 8px;
      margin-bottom: 7px;
    }
    .graph-setting > label { color: var(--fg); }
    .graph-setting > .graph-setting-value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .graph-setting > input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; }
    .graph-setting > input[type="checkbox"] { justify-self: end; margin: 0; }
    .graph-setting > .dropdown {
      grid-column: 2;
      min-width: 88px;
    }
    .graph-setting > .dropdown .dropdown-toggle {
      min-height: 26px;
      padding: 2px 7px;
    }
    .graph-panel .graph-reset {
      width: 100%;
      margin-top: 10px;
      padding: 4px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .graph-panel .graph-reset:hover { color: var(--fg); }
    /* ----------------------------------------------------------- Node menu */
    .graph-menu {
      position: fixed;
      z-index: 20;
      min-width: 190px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
      font-size: 12px;
    }
    .graph-menu .graph-menu-title {
      padding: 4px 8px 6px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* A path is the one thing here worth reading in full, so it wraps rather
       than being cut off at the menu's width. */
    .graph-menu .graph-menu-note {
      padding: 2px 8px 6px;
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }
    .graph-menu .graph-menu-note.error { color: var(--danger); }
    .graph-menu button {
      display: block;
      width: 100%;
      padding: 5px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--fg);
      text-align: left;
      cursor: pointer;
    }
    .graph-menu button:hover:not(:disabled) { background: var(--soft); }
    .graph-menu button:disabled { color: var(--muted); cursor: default; }
    /* The Graph tab replaces the table surface entirely. */
    #detail-view.graph-mode .toolbar,
    #detail-view.graph-mode .table-wrap,
    #detail-view.graph-mode .footer,
    #detail-view.graph-mode .progress { display: none !important; }
    #detail-view.graph-mode .graph-wrap {
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
    }
    #explorer-workspace.split-mode {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
      align-items: stretch;
      gap: 12px;
      height: 100%;
      min-height: 0;
    }
    #explorer-workspace.split-mode > .view {
      min-width: 0;
      min-height: 0;
      height: 100%;
    }
    #explorer-workspace.split-mode #collection-view {
      padding-right: 12px;
      border-right: 1px solid var(--border);
    }
    #explorer-workspace.split-mode #collection-view .collection-toolbar {
      align-items: stretch;
      flex-wrap: wrap;
    }
    #explorer-workspace.split-mode #collection-view .search-field {
      flex-basis: 100%;
      max-width: none;
    }
    #explorer-workspace.split-mode #collection-view .project-layout {
      grid-template-columns: minmax(180px, 210px) minmax(0, 1fr);
      height: 100%;
    }
    /* Library collapse must win over the split-mode column template, or the
       hidden library column still reserves ~180–210px of empty white space. */
    #explorer-workspace.split-mode #collection-view.library-collapsed .project-layout {
      grid-template-columns: 0 minmax(0, 1fr);
    }
    #explorer-workspace.split-mode #collection-view.library-collapsed .project-library-pane {
      border: none;
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
    }
    #explorer-workspace.split-mode #detail-view {
      min-width: 0;
    }
    #explorer-workspace.split-mode #tab-graph { display: none; }
    #explorer-workspace.split-mode #detail-view .toolbar {
      max-height: 140px;
      overflow-y: auto;
      padding-right: 3px;
    }
    .detail-collapse {
      margin-left: auto;
      color: var(--muted);
    }

    /* Floating preview card shown on row hover. */
    .row-preview {
      position: fixed;
      z-index: 1200;
      width: 400px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      overflow: hidden;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .3);
      pointer-events: none;
    }
    .row-preview-title {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }
    .row-preview-meta {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .row-preview-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 8px 0 2px;
    }
    .row-preview-tag {
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }
    .row-preview-tag.muted {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .row-preview-abstract {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 8px;
      color: var(--fg);
      font-size: 12px;
      line-height: 1.5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 8;
    }
    .row-preview-abstract.empty { color: var(--muted); font-style: italic; }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --card: #292b2f;
        --fg: #e7e9ec;
        --muted: #aeb4bc;
        --border: #484c53;
        --soft: #303b4c;
        --accent: #78aaf2;
        --green: #78c58a;
        --green-soft: #24372a;
        --orange: #e4aa52;
        --orange-soft: #3b3020;
        --danger: #f08374;
      }
    }
    @media (max-width: 900px) {
      .filter-field { flex-basis: calc(50% - 4px); }
      .filter-field.search-field { flex-basis: 100%; }
      th.source-col, td.source { display: none; }
      th.title-col { width: 52%; }
    }
  </style>
  <!-- Vendored force-graph (MIT, self-contained UMD → window.ForceGraph). Bundled
       locally because the explorer must work offline and cannot reach a CDN. -->
  <script src="vendor/force-graph.min.js"></script>
  <script src="literature-graph.js"></script>
  <script src="literature-explorer.js"></script>
</head>
<body>
  <nav class="page-tabs" id="page-tabs" aria-label="Open papers"></nav>

  <header class="page-head">
    <div class="title-wrap">
      <div class="app-title" id="app-title">Unizero Home</div>
      <div class="paper-title" id="paper-title"></div>
    </div>
  </header>

  <main id="explorer-workspace">
  <section class="view" id="collection-view">
    <div class="project-layout" id="project-layout">
      <aside class="project-library-pane" id="project-library-pane">
        <div class="collection-toolbar">
          <div class="filter-field search-field">
            <label class="filter-label" id="label-collection-search"
              for="collection-search"></label>
            <input id="collection-search" type="search"/>
          </div>
          <button id="collection-refresh"></button>
        </div>
        <div class="status" id="collection-status" role="status"></div>
        <div class="project-pane-title" id="project-library-title"></div>
        <div class="project-library-list" id="project-library-list"></div>
      </aside>
      <section class="project-board-pane">
        <button type="button" id="toggle-library-pane" class="library-pane-toggle"></button>
        <button type="button" id="toggle-detail-pane" class="detail-dock-toggle"></button>
        <div class="board-toolbar">
          <button type="button" id="board-add-text"></button>
          <button type="button" id="board-connect"></button>
          <button type="button" id="board-zoom-out">−</button>
          <button type="button" id="board-zoom-fit">100%</button>
          <button type="button" id="board-zoom-in">+</button>
          <button type="button" id="board-delete"></button>
        </div>
        <div class="project-board-viewport" id="project-board-viewport">
          <div class="project-board-surface" id="project-board-surface">
            <svg xmlns="http://www.w3.org/2000/svg"
              class="board-edge-layer" id="project-board-edges"
              width="3200" height="2200"></svg>
            <div class="project-board-empty" id="project-board-empty">
              <strong id="project-board-empty-title"></strong>
              <span id="project-board-empty-hint"></span>
            </div>
          </div>
        </div>
      </section>
    </div>

  </section>

  <section class="view" id="detail-view" hidden="hidden">
    <nav class="tabs" aria-label="Relation type">
      <button class="tab" id="tab-graph" data-kind="graph"></button>
      <button class="tab" id="tab-references" data-kind="references"></button>
      <button class="tab" id="tab-relation" data-kind="relation"></button>
      <button class="tab" id="tab-citations" data-kind="citations"></button>
      <button class="detail-collapse" id="collapse-detail"></button>
    </nav>

    <div class="graph-wrap" id="detail-graph-wrap" hidden="hidden">
      <div class="graph-canvas" id="detail-graph"></div>
      <div class="graph-overlay" id="detail-graph-overlay"></div>
      <button class="graph-gear" id="detail-graph-gear">⚙</button>
      <div class="graph-panel" id="detail-graph-panel" hidden="hidden"></div>
      <div class="graph-empty" id="detail-graph-empty" hidden="hidden"></div>
      <div class="detail-graph-filters">
        <div class="filter-field">
          <div class="filter-label" id="label-detail-links"></div>
          <div id="filter-detail-links"></div>
        </div>
        <div class="filter-field shared-field">
          <label class="filter-label" id="label-detail-shared"
            for="detail-min-shared"></label>
          <input id="detail-min-shared" type="number" min="1" step="1" value="1"/>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="filter-field search-field">
        <label class="filter-label" id="label-search" for="search"></label>
        <input id="search" type="search"/>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-source"></div>
        <div id="filter-source"></div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-library"></div>
        <div id="filter-library"></div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-influence"></div>
        <div id="filter-influence"></div>
      </div>
      <div class="filter-field year-field">
        <div class="filter-label" id="label-year"></div>
        <div class="year-inputs">
          <input id="year-from" type="number" inputmode="numeric"/>
          <span class="year-separator">–</span>
          <input id="year-to" type="number" inputmode="numeric"/>
        </div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-publication-type"></div>
        <div id="filter-publication-type"></div>
      </div>
      <div class="filter-field" id="publication-level-field" hidden="hidden">
        <div class="filter-label" id="label-publication-level"></div>
        <div id="filter-publication-level"></div>
      </div>
      <div class="filter-field">
        <div class="filter-label" id="label-order"></div>
        <div id="sort"></div>
      </div>
      <button id="refresh"></button>
    </div>

    <div class="status" id="status" role="status"></div>
    <div class="progress" id="progress" hidden="hidden">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="progress-sources" id="progress-sources"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="title-col" id="head-title"></th>
            <th class="year-col" id="head-year"></th>
            <th class="citations-col" id="head-citations"></th>
            <th class="influence-col" id="head-influence"></th>
            <th class="source-col" id="head-source"></th>
            <th class="library-col" id="head-library"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="footer">
      <button id="load-more" hidden="hidden"></button>
    </div>
  </section>
  </main>

  <!-- One node menu for both graphs: only one of them is ever on screen. -->
  <div class="graph-menu" id="graph-menu" hidden="hidden"></div>
</body>
</html>
