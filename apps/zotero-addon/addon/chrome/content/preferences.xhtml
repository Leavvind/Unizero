<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox id="zotero-prefpane-__addonRef__" onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', {window})">
  <groupbox>
    <html:h2 data-l10n-id="caption-api"></html:h2>
    <html:div style="margin-left: .7em; margin-bottom: .5em; opacity: .8;" data-l10n-id="sourceOrder-note"></html:div>
    <hbox style="margin: 4px 0; margin-left: .7em;">
      <html:span style="margin: auto 0; margin-right: .5em;" data-l10n-id="semanticScholarApiKey"></html:span>
      <html:input style="width: 22em; margin: auto 0; height: 1em;" type="password"
        id="__addonRef__-semantic-scholar-api-key"
        preference="extensions.zotero.__addonRef__.semanticScholar.apiKey">
      </html:input>
    </hbox>
    <html:div style="margin-left: .7em; margin-top: .3em; opacity: .8;" data-l10n-id="semanticScholarApiKey-note"></html:div>
  </groupbox>
  <groupbox>
    <html:h2 data-l10n-id="caption-refresh"></html:h2>
    <checkbox native="true" id="__addonRef__-auto-refresh" data-l10n-id="autoRefresh"
      preference="extensions.zotero.__addonRef__.autoRefresh" />
    <html:div style="
        display: flex;
        margin-top: .5em;
        flex-direction: row;
        align-items: left;
        width: 80%;
      ">
      <html:input style="
          width: 100%;
          margin: auto .5em;
        " type="text" id="__addonRef__-not-auto-refresh-item-types"
        preference="extensions.zotero.__addonRef__.notAutoRefreshItemTypes">
      </html:input>
    </html:div>
  </groupbox>
  <groupbox>
    <html:h2 data-l10n-id="caption-tip"></html:h2>
    <hbox style="margin: 4px 0;margin-left: .7em;">
      <html:span style="margin: auto 0; margin-right: .5em;" data-l10n-id="tipBackgroundColor"></html:span>
      <html:input style="width: 6em; margin: auto 0; height: 1em;" type="text" id="__addonRef__-tip-background-color"
        preference="extensions.zotero.__addonRef__.tipBackgroundColor">
      </html:input>
      <html:span style="margin: auto 0; margin-left: 1em; margin-right: .5em;" data-l10n-id="tipTitleColor"></html:span>
      <html:input style="width: 6em; margin: auto 0; height: 1em;" type="text" id="__addonRef__-tip-title-color"
        preference="extensions.zotero.__addonRef__.tipTitleColor">
      </html:input>
    </hbox>
    <html:div style="
      display: flex;
      flex-direction: row;
    ">
      <checkbox native="true" id="__addonRef__-is-show-tip" data-l10n-id="isShowTip-start"
        preference="extensions.zotero.__addonRef__.isShowTip" style="margin-right: .5em;"/>
      <html:input style="width: 4em; margin: auto 0; height: 1em;" type="text"
        id="__addonRef__-remove-tip-after-millisecond"
        preference="extensions.zotero.__addonRef__.showTipAfterMillisecond">
      </html:input>
      <html:span style="margin: auto 0; margin-left: .5em;" data-l10n-id="isShowTip-end"></html:span>
    </html:div>
    <checkbox native="true" id="__addonRef__-ctrl-click-translate" data-l10n-id="ctrlClickTranslate"
      preference="extensions.zotero.__addonRef__.ctrlClickTranslate" />
    <hbox style="margin: 4px 0;margin-left: .7em;">
      <html:span style="margin: auto 0; margin-right: .5em;" data-l10n-id="shadeMillisecond-start"></html:span>
      <html:input style="width: 4em; margin: auto 0; height: 1em;" type="text" id="__addonRef__-shade-millisecond"
        preference="extensions.zotero.__addonRef__.shadeMillisecond">
      </html:input>
      <html:span style="margin: auto 0; margin-left: .5em;" data-l10n-id="shadeMillisecond-end"></html:span>
    </hbox>
    <hbox style="margin: 4px 0;margin-left: .7em;">
      <html:span style="margin: auto 0;margin-right: .5em;" data-l10n-id="removeTipAfterMillisecond-start"></html:span>
      <html:input style="width: 4em; margin: auto 0; height: 1em;" type="text"
        id="__addonRef__-remove-tip-after-millisecond"
        preference="extensions.zotero.__addonRef__.removeTipAfterMillisecond">
      </html:input>
      <html:span style="margin: auto 0; margin-left: .5em;" data-l10n-id="removeTipAfterMillisecond-end">
      </html:span>
    </hbox>
  </groupbox>
  <groupbox>
    <html:h2 data-l10n-id="caption-related"></html:h2>
    <checkbox native="true" id="__addonRef__-loading-related" data-l10n-id="loadingRelated"
      preference="extensions.zotero.__addonRef__.loadingRelated" />
  </groupbox>
  <groupbox>
    <html:h2 data-l10n-id="caption-save"></html:h2>
    <checkbox native="true" id="__addonRef__-save-api-references" data-l10n-id="saveAPIReferences"
      preference="extensions.zotero.__addonRef__.saveAPIReferences" />
    <checkbox native="true" id="__addonRef__-save-citations" data-l10n-id="saveCitations"
      preference="extensions.zotero.__addonRef__.saveCitations" />
    <html:div style="margin-left: .7em; margin-top: .3em; opacity: .8;" data-l10n-id="save-note"></html:div>
  </groupbox>
  <groupbox>
    <html:h2 data-l10n-id="caption-match"></html:h2>
    <hbox style="margin-left: .7em;display: flex;align-items: center;">
      <html:span style="margin: auto 0; margin-right: .5em;" data-l10n-id="notInLibarayOpacity-start"></html:span>
      <html:input style="width: 4em; margin: auto 0; height: 1em;" type="range" min="0" max="1" step="0.01" id="__addonRef__-not-in-library-opacity"
        preference="extensions.zotero.__addonRef__.notInLibarayOpacity">
      </html:input>
      <html:span style="margin: auto 0; margin-left: .5em;" data-l10n-id="notInLibarayOpacity-end"></html:span>
    </hbox>
  </groupbox>

  <!--
    The two groups below have no preference= binding; src/modules/prefs.ts reads and
    writes them through getRuntimePref / setRuntimePref instead. These keys are typed
    (port is an integer) and already have typed accessors, so adding a declarative
    write path would open a second way to write the same keys.
  -->
  <groupbox>
    <html:h2 data-l10n-id="caption-runtime"></html:h2>
    <html:div style="margin-left: .7em; margin-bottom: .5em; opacity: .8;" data-l10n-id="runtime-note"></html:div>
    <hbox style="margin: 4px 0; margin-left: .7em; align-items: center;">
      <html:span style="margin: auto 0; margin-right: .5em; min-width: 7em;" data-l10n-id="runtime-pythonPath"></html:span>
      <html:input style="width: 24em; margin: auto 0; height: 1em;" type="text"
        id="__addonRef__-runtime-python-path" data-l10n-id="runtime-pythonPath-input">
      </html:input>
    </hbox>
    <hbox style="margin: 4px 0; margin-left: .7em; align-items: center;">
      <html:span style="margin: auto 0; margin-right: .5em; min-width: 7em;" data-l10n-id="runtime-serverScript"></html:span>
      <html:input style="width: 24em; margin: auto 0; height: 1em;" type="text"
        id="__addonRef__-runtime-server-script" data-l10n-id="runtime-serverScript-input">
      </html:input>
    </hbox>
    <hbox style="margin: 4px 0; margin-left: .7em; align-items: center;">
      <html:span style="margin: auto 0; margin-right: .5em; min-width: 7em;" data-l10n-id="runtime-port"></html:span>
      <html:input style="width: 6em; margin: auto 0; height: 1em;" type="number" min="1" max="65535"
        id="__addonRef__-runtime-port">
      </html:input>
      <html:span style="margin: auto 0; margin-left: .7em; opacity: .8;" data-l10n-id="runtime-port-note"></html:span>
    </hbox>
    <checkbox native="true" id="__addonRef__-runtime-auto-start" data-l10n-id="runtime-autoStart" />
    <checkbox native="true" id="__addonRef__-runtime-auto-stop" data-l10n-id="runtime-autoStopOnQuit" />
  </groupbox>

  <groupbox>
    <html:h2 data-l10n-id="caption-conversion"></html:h2>
    <checkbox native="true" id="__addonRef__-conversion-md-snapshot" data-l10n-id="conversion-mdSnapshot" />
    <html:div style="margin-left: .7em; margin-top: .3em; opacity: .8;" data-l10n-id="conversion-note"></html:div>
    <hbox style="margin: 8px 0 4px; margin-left: .7em; align-items: center;">
      <html:span style="margin: auto 0; margin-right: .5em; min-width: 7em;" data-l10n-id="conversion-obsidianVault"></html:span>
      <html:input style="width: 16em; margin: auto 0; height: 1em;" type="text"
        id="__addonRef__-conversion-obsidian-vault" data-l10n-id="conversion-obsidianVault-input">
      </html:input>
    </hbox>
    <html:div style="margin-left: .7em; margin-top: .3em; opacity: .8;" data-l10n-id="conversion-obsidianVault-note"></html:div>
  </groupbox>

  <groupbox>
    <html:h2 data-l10n-id="caption-sync"></html:h2>
    <html:div style="margin-left: .7em; margin-bottom: .5em; opacity: .8;" data-l10n-id="sync-note"></html:div>
    <hbox style="margin: 4px 0; margin-left: .7em; align-items: center;">
      <html:span style="margin: auto 0; margin-right: .5em; min-width: 9em;" data-l10n-id="sync-webdav-url"></html:span>
      <html:input style="width: 24em; margin: auto 0; height: 1em;" type="url"
        id="__addonRef__-sync-webdav-url">
      </html:input>
    </hbox>
    <hbox style="margin: 4px 0; margin-left: .7em; align-items: center;">
      <html:span style="margin: auto 0; margin-right: .5em; min-width: 9em;" data-l10n-id="sync-webdav-username"></html:span>
      <html:input style="width: 24em; margin: auto 0; height: 1em;" type="email"
        id="__addonRef__-sync-webdav-username">
      </html:input>
    </hbox>
    <hbox style="margin: 4px 0; margin-left: .7em; align-items: center;">
      <html:span style="margin: auto 0; margin-right: .5em; min-width: 9em;" data-l10n-id="sync-webdav-password"></html:span>
      <html:input style="width: 24em; margin: auto 0; height: 1em;" type="password"
        id="__addonRef__-sync-webdav-password">
      </html:input>
    </hbox>
    <html:div style="margin-left: .7em; margin-top: .3em; opacity: .8;" data-l10n-id="sync-webdav-password-note"></html:div>
    <checkbox native="true" id="__addonRef__-sync-remember-password"
      data-l10n-id="sync-remember-password" />
    <hbox style="margin: 6px 0 4px; margin-left: .7em; align-items: center;">
      <checkbox native="true" id="__addonRef__-sync-auto"
        data-l10n-id="sync-auto" />
      <html:span style="margin: auto .5em auto 1em;" data-l10n-id="sync-interval"></html:span>
      <html:select id="__addonRef__-sync-interval">
        <html:option value="30" data-l10n-id="sync-interval-30"></html:option>
        <html:option value="60" data-l10n-id="sync-interval-60"></html:option>
        <html:option value="180" data-l10n-id="sync-interval-180"></html:option>
        <html:option value="360" data-l10n-id="sync-interval-360"></html:option>
      </html:select>
    </hbox>
    <hbox style="margin: 4px 0; margin-left: .7em; align-items: center;">
      <html:span style="margin: auto .5em auto 0;" data-l10n-id="sync-notifications"></html:span>
      <html:select id="__addonRef__-sync-notifications">
        <html:option value="errors" data-l10n-id="sync-notifications-errors"></html:option>
        <html:option value="all" data-l10n-id="sync-notifications-all"></html:option>
        <html:option value="none" data-l10n-id="sync-notifications-none"></html:option>
      </html:select>
    </hbox>
    <hbox style="margin: 8px 0 4px; margin-left: .7em; align-items: center;">
      <html:button type="button" id="__addonRef__-sync-now" data-l10n-id="sync-now"></html:button>
      <html:span style="margin-left: .7em; opacity: .8;" id="__addonRef__-sync-status"></html:span>
    </hbox>
  </groupbox>
</vbox>
