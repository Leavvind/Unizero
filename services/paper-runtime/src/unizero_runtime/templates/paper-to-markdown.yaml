schema_version: 1
id: paper-to-markdown
name: Journal Papers
version: 5
description: Convert a journal paper with MinerU (VLM-assisted) and store the Markdown under the Zotero item as Raw, with the table digest and the extracted References. Raw is your working copy and is never overwritten; Raw Backup is replaced on every conversion.
modules:
  - id: extract
    module: extract.mineru
    enabled: true
    settings:
      execution: local
      backend: standard
      ocr_mode: auto
      language: en
      chunking:
        enabled: false
        threshold_pages: 200
        chunk_size: 50

  - id: page-links
    module: transform.zotero-page-links
    enabled: true
    settings: {}

  - id: content
    module: transform.content
    enabled: true
    settings:
      formulas: keep
      figures: pointer
      tables:
        markdown: pointer
        refine_complex: false
        digest: true
        digest_figures: false
      references:
        extract: true
        remove_from_body: true
      remove_repeated_lines: false

  - id: zotero-markdown
    module: publish.zotero-markdown
    enabled: true
    settings:
      filename: "{{ title }}.md"
