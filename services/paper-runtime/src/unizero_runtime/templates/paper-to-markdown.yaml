schema_version: 1
id: paper-to-markdown
name: Generate paper Markdown
version: 3
description: Convert, clean up, and publish a Zotero PDF as Markdown using MinerU.
modules:
  - id: extract
    module: extract.mineru
    enabled: true
    settings:
      execution: local
      backend: pipeline
      ocr_mode: auto
      language: auto
      enable_formula: true
      enable_table: true
      chunking:
        enabled: true
        threshold_pages: 200
        chunk_size: 50

  - id: page-links
    module: transform.zotero-page-links
    enabled: true
    settings: {}

  - id: references
    module: transform.references
    enabled: true
    settings:
      warn_if_empty: true

  - id: markdown-cleanup
    module: transform.markdown-cleanup
    enabled: true
    settings:
      images_mode: none
      table_mode: none
      strip_repeated_lines: false
      strip_references: true
      table_vlm: false

  - id: tables-export
    module: export.zotero-tables
    enabled: true
    settings:
      include_figures: false

  - id: frontmatter
    module: transform.frontmatter
    enabled: true
    settings:
      properties:
        - {key: title, value: "{{ title }}", type: text}
        - {key: aliases, value: "{{ citekey }}", type: list}
        - {key: authors, value: "{{ authors }}", type: list}
        - {key: year, value: "{{ year }}", type: number}
        - {key: citekey, value: "{{ citekey }}", type: text}
        - {key: uid, value: "{{ uid }}", type: text}
        - {key: doi, value: "{{ doi }}", type: text}
        - {key: publication, value: "{{ publication }}", type: text}
        - {key: unizero-item, value: "{{ unizero_item }}", type: text}
        - {key: zotero, value: "{{ zotero_select }}", type: text}
        - {key: unizero-attachment, value: "{{ unizero_attachment }}", type: text}
        - {key: pdf, value: "{{ zotero_pdf }}", type: text}
        - {key: pdf-path, value: "{{ pdf_path }}", type: text}
        - {key: semantic-scholar, value: "{{ semantic_scholar }}", type: text}
        - {key: citations, value: "{{ citations }}", type: number}
        - {key: tags, value: [paper], type: list}
        - {key: created, value: "{{ today }}", type: date}
        - {key: converter, value: "{{ converter }}", type: text}

  - id: publish
    module: publish.markdown-directory
    enabled: true
    settings:
      destination: 20_Papers
      filename: "{{ title }}.md"
      attachments_directory: attachments
      copy_referenced_only: true
      existing_file: overwrite
