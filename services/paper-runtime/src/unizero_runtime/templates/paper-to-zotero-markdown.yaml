schema_version: 1
id: paper-to-zotero-markdown
name: Generate Raw Markdown
version: 1
description: Convert a Zotero PDF with MinerU and store the Markdown under the Zotero item. Raw is your working copy and is never overwritten; Raw Backup is replaced on every conversion. Add "Publish · Markdown directory" to publish to an Obsidian vault as well.
modules:
  - id: extract
    module: extract.mineru
    enabled: true
    settings:
      execution: local
      backend: basic
      ocr_mode: auto
      language: auto
      enable_formula: true
      enable_table: true
      chunking:
        enabled: true
        threshold_pages: 200
        chunk_size: 50

  - id: page-links
    module: transform.zotero-page-links
    enabled: true
    settings: {}

  - id: references
    module: transform.references
    enabled: true
    settings:
      warn_if_empty: true

  - id: markdown-cleanup
    module: transform.markdown-cleanup
    enabled: true
    settings:
      images_mode: none
      table_mode: none
      strip_repeated_lines: false
      strip_references: true
      table_vlm: false

  - id: tables-export
    module: export.zotero-tables
    enabled: true
    settings:
      include_figures: false

  - id: frontmatter
    module: transform.frontmatter
    enabled: true
    settings: {}

  - id: publish-zotero-markdown
    module: publish.zotero-markdown
    enabled: true
    settings:
      filename: "{{ title }}.md"
