[project]
name = "unizero-runtime"
version = "0.1.0"
description = "UniZero paper runtime: local PDF-to-Markdown conversion and annotation injection"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.139,<0.140",
    "mineru[pipeline]==3.4.4",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "pymupdf>=1.28,<2",
    "six>=1.17,<2",
    "uvicorn>=0.51,<0.52",
]

[project.scripts]
unizero-runtime = "unizero_runtime.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unizero_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must not touch the developer's real runtime home. Each test that needs state
# uses the tmp_path fixture and passes an explicit home; this makes an accidental
# fallback to the default home fail loudly rather than silently writing there.
addopts = "-ra"
